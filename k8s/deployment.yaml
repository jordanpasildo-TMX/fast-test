apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-test
  labels:
    app.kubernetes.io/name: fast-test
    app.kubernetes.io/part-of: tmx-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-test
  template:
    metadata:
      labels:
        app: fast-test
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: fast-test
          image: ghcr.io/jordanpasildo-tmx/fast-test:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
